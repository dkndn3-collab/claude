<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GradientForge</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <span class="wordmark">GradientForge</span>
      <span class="tagline">procedural · zero assets</span>
    </header>

    <main class="body" id="body">
      <section class="view" id="view"></section>
    </main>

    <footer class="dock">
      <button class="ghost" id="gfCopy" title="Copy the parameters as JSON">Copy settings</button>
      <button class="solid" id="gfCreate">Create gradient</button>
    </footer>

    <footer class="statusbar" id="status" data-state="idle">
      <span class="dot"></span>
      <span class="msg" id="statusMsg">Ready</span>
    </footer>

  </div>

  <script src="js/lib/cep-bridge.js"></script>
  <script src="js/lib/controls.js"></script>
  <script src="js/data/library.js"></script>
  <script src="js/data/gradients.js"></script>
  <script src="js/data/sdf.js"></script>
  <script src="js/data/gradient-preview.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
